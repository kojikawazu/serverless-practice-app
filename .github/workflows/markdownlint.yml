# Markdown の検査（docs レーン）。書式（markdownlint）と相対リンクの実在（doc-links）。既存の CI とは発火条件も実行内容も別物のため独立させる。
# 設定の正本: .markdownlint-cli2.jsonc / 運用方針の正本: .claude/rules/static-analysis.md
name: markdownlint

# パスフィルタはかけない。実行が数秒で終わる一方、必須チェックにした際に
# パスフィルタの設計を誤ると PR がマージ不能になるため（起動しないワークフローの
# 必須チェックは pending のまま完了しない）。常時起動ならその余地が無い。
# actionlint のワークフローも同じ理由で常時実行する。
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 検査コマンドとバージョンは scripts/ の 1 箇所に定義し、CI もローカルもそれを実行する
      # （手順を CI とローカルに書き分けると、必ずどちらかが腐る）
      - name: Lint Markdown
        run: ./scripts/lint-docs.sh

  # 相対リンクのリンク先（ファイル・見出し）の実在（#87）。markdownlint の MD051 は同じファイルの中しか見ないため、
  # ファイルをまたぐリンクはここで確かめる。見出しの ID を GitHub と同じ規則で作る依存（github-slugger）を入れるため npm ci が要る
  doc-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check Markdown links
        run: ./scripts/check-doc-links.sh
