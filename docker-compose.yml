# local ステージ用の LocalStack。起動・停止は scripts/localstack.sh から行う（手順をここと README に書き分けない）。
services:
  localstack:
    # タグは固定する（latest にすると、何も変えていないのに挙動が変わる。docs/04「対応環境」）。
    # 2026-03-23 以降の版は起動に認証トークンが要る（無料の Hobby プランで足りる）
    image: localstack/localstack:2026.09.1
    container_name: serverless-practice-app-localstack
    ports:
      # 手元からだけ接続できるよう、ループバックに限って公開する
      - "127.0.0.1:4566:4566"
    environment:
      # トークンは Git 管理外の .env から読む（.env.example を参照）。未設定なら起動前にエラーで止める
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:?.env に LOCALSTACK_AUTH_TOKEN を設定してください（.env.example を参照）}
      # 1 なら Lambda のアーキテクチャ指定（ARM_64）を無視し、ホストのアーキテクチャで動かす。
      # x86 のホスト（CI のランナー・Intel の Mac）用。既定は 0（指定どおりに動かす。docs/09「環境変数」）
      LAMBDA_IGNORE_ARCHITECTURE: ${LAMBDA_IGNORE_ARCHITECTURE:-0}
    volumes:
      # Lambda の実行環境（コンテナ）を LocalStack が起動するために、Docker ソケットを渡す
      - /var/run/docker.sock:/var/run/docker.sock
